<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sandbox Shipping Architecture</title><style>body{margin:0;background:#020617;color:#e2e8f0;font-family:Inter,system-ui,sans-serif} .wrap{max-width:1100px;margin:0 auto;padding:32px} .card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:18px;margin:14px 0} .row{display:flex;gap:12px;flex-wrap:wrap} .box{flex:1;min-width:180px;padding:14px;border-radius:14px;border:1px solid} .front{background:rgba(8,51,68,.4);border-color:#22d3ee} .back{background:rgba(6,78,59,.4);border-color:#34d399} .db{background:rgba(76,29,149,.4);border-color:#a78bfa} .ext{background:rgba(30,41,59,.5);border-color:#94a3b8}</style></head><body><div class="wrap"><h1>Sandbox Shipping AI Front Desk</h1><div class="card"><div class="row"><div class="box front"><strong>Browser UI</strong><br>Chat + KB editor</div><div class="box back"><strong>Assistant Logic</strong><br>FAQ, lead intake, routing</div><div class="box db"><strong>Local Data</strong><br>Knowledge base + lead JSON</div><div class="box ext"><strong>Manual Handoff</strong><br>Escalations to human team</div></div></div></div></body></html>
